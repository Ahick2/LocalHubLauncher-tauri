[package]
name = "local-hub-launcher"
version = "2.0.0"
description = "Portable local service supervisor"
edition = "2021"
rust-version = "1.88"

[lib]
name = "local_hub_launcher"
crate-type = ["lib"]

[[bin]]
name = "LocalHubLauncher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
tokio = { version = "1", features = ["process", "fs", "io-util", "rt-multi-thread", "time", "sync", "macros"] }
parking_lot = "0.12"
base64 = "0.22"
encoding_rs = "0.8"
url = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Pipes", "Win32_System_IO", "Win32_Globalization", "Win32_Storage_FileSystem"] }
winreg = "0.56"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
